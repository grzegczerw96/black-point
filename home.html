<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Black Point - Photographers in mono</title>
	<meta name="description" content="Black Point is a collective of twelve photographers working in mono: portraits, campaigns and long-form documentary.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..60,700..900&family=Archivo:wdth,wght@112,800&family=Instrument+Sans:wght@400;500;600&display=swap">
	<link rel="stylesheet" href="css/style.css" />
	<link rel="stylesheet" href="css/tokens.css" />
	<link rel="stylesheet" href="css/home.css" />
</head>
<body class="loading">

	<div id="pageOverlay"></div>

	<div id="page-to-page">
		<div class="red-bg"></div>
		<div class="grey-bg"></div>
	</div>

	<a href="#top" id="logo" class="page-link" aria-label="Black Point"></a>

	<div id="hamburger">
		<span><span>Close</span></span>
		<i><b></b><b></b><b></b></i>
	</div>
	<div id="nav-bg"></div>
	<nav id="navigation" class="op-xl-10 op-lg-10 op-sm-24"><div></div></nav>

	<main id="smooth-wrapper">
		<div id="smooth-content" class="home">

			<!-- 01 + 02 ONE PINNED SCENE: the hero frame opens into the photographers list ==================== -->
			<section id="intro" class="h-intro">
				<figure class="intro-frame" aria-hidden="true">
					<div class="frame-zoom">
						<div class="frame-in"></div>
						<div class="frame-hover"><img alt=""></div>
					</div>
					<div class="frame-shade"></div>
				</figure>

				<div class="hero-layer">
					<h1 class="hero-title" aria-label="We photograph in mono">
						<span class="hl hl-1" aria-hidden="true">We photograph</span>
						<span class="hl hl-2" aria-hidden="true">In mono.</span>
					</h1>
					<p class="hero-lead">A collective of twelve photographers. Portraits, campaigns and long-form documentary, shot and printed in black and white.</p>
				</div>

				<div id="team" class="team-layer">
					<div class="team-list">
						<div class="track"><i></i></div>
						<ul></ul>
					</div>
					<div class="team-cap">
						<p class="cap-work"><span><span></span></span></p>
						<a class="cap-link" href="#">View profile &rarr;</a>
					</div>
				</div>
			</section>

			<!-- 03 TWO STUDIOS + 04 GET IN TOUCH — shared with the Contact page, rendered by js/site.js ======= -->
			<section id="studios" class="h-studios" data-include="studios"></section>
			<footer id="contact" class="h-contact" data-include="contact"></footer>

		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
	<script src="js/themes.js"></script>
	<script src="js/site.js"></script>
	<script src="js/home.js"></script>
</body>
</html>
